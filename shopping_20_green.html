<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping English — Собери перевод</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f3f6fb; color: #243047;
    font-family: Arial, Helvetica, sans-serif;
  }
  .quiz {
    width: min(720px, 100%); background: #fff; border-radius: 22px;
    padding: 32px; box-shadow: 0 12px 35px rgba(30,50,90,.12);
  }
  .top { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  h1 { font-size: clamp(24px, 4vw, 32px); margin:0 0 8px; }
  .subtitle { color:#68758b; margin:0 0 24px; font-size:16px; }
  .counter { color:#68758b; font-weight:700; white-space:nowrap; }
  .track { height:8px; background:#e9edf4; border-radius:99px; overflow:hidden; margin:18px 0 30px; }
  .bar { height:100%; width:0; background:#5278d8; transition:width .25s; }
  .sentence { font-size:clamp(22px, 4vw, 29px); line-height:1.55; margin:12px 0 28px; }
  .blank { display:inline-block; min-width:82px; text-align:center; color:#5278d8; font-weight:700; border-bottom:3px solid #b8c7e8; padding:0 5px 2px; }
  .choices { display:flex; flex-wrap:wrap; gap:12px; }
  .choice {
    border:2px solid #d8dfeb; background:#fff; color:#243047; border-radius:12px;
    padding:13px 28px; font-size:19px; font-weight:700; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .choice:hover:not(:disabled) { border-color:#5278d8; background:#f4f7ff; }
  .choice:disabled { cursor:default; opacity:1; }
  .choice.correct { background:#dff5e6; border-color:#32a45b; color:#176b35; }
  .choice.wrong { background:#ffe3e3; border-color:#d94b4b; color:#a52222; }
  .feedback { min-height:30px; margin:20px 0 8px; font-size:16px; font-weight:700; }
  .feedback.good { color:#218447; }
  .feedback.bad { color:#c03939; }
  .bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:22px; }
  .score { color:#68758b; font-size:15px; }
  .next, .restart {
    border:0; border-radius:12px; padding:13px 20px; font-size:17px;
    font-weight:700; color:white; background:#5278d8; cursor:pointer;
  }
  .next:disabled { background:#c4ccda; cursor:not-allowed; }
  .next span { font-size:22px; vertical-align:-1px; margin-left:8px; }
  .finish { text-align:center; padding:24px 0 8px; }
  .finish h2 { font-size:28px; }
  .finish p { color:#68758b; font-size:18px; line-height:1.5; }
  @media (max-width:520px) { .quiz{padding:22px;} .bottom{align-items:flex-end;} .choice{flex:1;} }

  .answer { display:flex; flex-wrap:wrap; gap:10px; align-items:center; min-height:76px;
    border:2px dashed #d8dfeb; border-radius:12px; padding:12px; margin: -8px 0 22px; }
  .answer:empty::before { content:"Нажимайте на слова, чтобы составить перевод"; color:#8995a7; font-size:15px; }
  .answer .choice { padding:10px 17px; font-size:18px; }
  .answer .choice.correct { background:#dff5e6; border-color:#32a45b; color:#176b35; }
  .answer.good { border-color:#32a45b; background:#f0fbf3; }
  .sentence.good { color:#218447; }
  .answer.bad { border-color:#d94b4b; }
  .word-bank { margin-top:8px; }
  @media (max-width:520px) { .answer .choice { flex:0 1 auto; } }
</style>
</head>
<body>
<main class="quiz">
  <div class="top">
    <div>
      <h1>Shopping English</h1>
      <p class="subtitle">Составьте английский перевод из слов</p>
    </div>
    <div class="counter" id="counter">1 / 20</div>
  </div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <section id="questionArea">
    <div class="sentence" id="sentence"></div>
    <div class="answer" id="answer" aria-label="Составленный перевод"></div>
    <div class="choices word-bank" id="choices"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="bottom">
      <div class="score" id="score">Правильных ответов: 0</div>
      <button class="next" id="next" disabled aria-label="Следующий вопрос">Далее <span>➜</span></button>
    </div>
  </section>
  <section class="finish" id="finish" hidden>
    <h2>Готово!</h2>
    <p id="result"></p>
    <button class="restart" id="restart">Пройти ещё раз ↻</button>
  </section>
</main>
<script>
const questions = [
  {
    "text": "Это дорого?",
    "words": [
      "Is",
      "it",
      "expensive"
    ]
  },
  {
    "text": "Есть скидка?",
    "words": [
      "Is",
      "there",
      "a",
      "discount"
    ]
  },
  {
    "text": "Сколько стоит?",
    "words": [
      "How",
      "much",
      "is",
      "it"
    ]
  },
  {
    "text": "Можно примерить?",
    "words": [
      "Can",
      "I",
      "try",
      "it",
      "on"
    ]
  },
  {
    "text": "Где касса?",
    "words": [
      "Where",
      "is",
      "the",
      "checkout"
    ]
  },
  {
    "text": "У вас есть мой размер?",
    "words": [
      "Do",
      "you",
      "have",
      "my",
      "size"
    ]
  },
  {
    "text": "Можно оплатить картой?",
    "words": [
      "Can",
      "I",
      "pay",
      "by",
      "card"
    ]
  },
  {
    "text": "Есть ли эта рубашка в синем цвете?",
    "words": [
      "Do",
      "you",
      "have",
      "this",
      "shirt",
      "in",
      "blue"
    ]
  },
  {
    "text": "Когда закончится эта распродажа?",
    "words": [
      "When",
      "will",
      "this",
      "sale",
      "end"
    ]
  },
  {
    "text": "Могу ли я получить чек, пожалуйста?",
    "words": [
      "Can",
      "I",
      "get",
      "a",
      "receipt",
      "please"
    ]
  },
  {
    "text": "Сколько стоит доставка до моего дома?",
    "words": [
      "How",
      "much",
      "does",
      "delivery",
      "to",
      "my",
      "home",
      "cost"
    ]
  },
  {
    "text": "Можно ли вернуть товар без упаковки?",
    "words": [
      "Can",
      "I",
      "return",
      "the",
      "item",
      "without",
      "its",
      "packaging"
    ]
  },
  {
    "text": "Есть ли у вас такая же модель дешевле?",
    "words": [
      "Do",
      "you",
      "have",
      "the",
      "same",
      "model",
      "at",
      "a",
      "lower",
      "price"
    ]
  },
  {
    "text": "Почему цена на сайте отличается от цены в магазине?",
    "words": [
      "Why",
      "is",
      "the",
      "price",
      "online",
      "different",
      "from",
      "the",
      "price",
      "in",
      "store"
    ]
  },
  {
    "text": "Когда мой заказ будет готов к получению?",
    "words": [
      "When",
      "will",
      "my",
      "order",
      "be",
      "ready",
      "for",
      "pickup"
    ]
  },
  {
    "text": "Могу ли я обменять этот товар на другой размер?",
    "words": [
      "Can",
      "I",
      "exchange",
      "this",
      "item",
      "for",
      "a",
      "different",
      "size"
    ]
  },
  {
    "text": "Как я могу проверить, есть ли этот товар в наличии?",
    "words": [
      "How",
      "can",
      "I",
      "check",
      "if",
      "this",
      "item",
      "is",
      "in",
      "stock"
    ]
  },
  {
    "text": "Можете объяснить, как действует гарантия на этот товар?",
    "words": [
      "Can",
      "you",
      "explain",
      "how",
      "the",
      "warranty",
      "works",
      "for",
      "this",
      "product"
    ]
  },
  {
    "text": "Что мне делать, если я получу повреждённый товар вместо нового?",
    "words": [
      "What",
      "should",
      "I",
      "do",
      "if",
      "I",
      "receive",
      "a",
      "damaged",
      "item",
      "instead",
      "of",
      "a",
      "new",
      "one"
    ]
  },
  {
    "text": "Можете сказать, когда я получу деньги обратно после возврата этого заказа?",
    "words": [
      "Can",
      "you",
      "tell",
      "me",
      "when",
      "I",
      "will",
      "get",
      "my",
      "money",
      "back",
      "after",
      "returning",
      "this",
      "order"
    ]
  }
];
let index=0, correct=0, selected=[], solved=false;
const sentence=document.getElementById('sentence');
const choices=document.getElementById('choices');
const answer=document.getElementById('answer');
const feedback=document.getElementById('feedback');
const next=document.getElementById('next');
const counter=document.getElementById('counter');
const score=document.getElementById('score');
const bar=document.getElementById('bar');
const questionArea=document.getElementById('questionArea');
const finish=document.getElementById('finish');
function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
let wordOrder=[];
function renderQuestion() {
  selected=[]; solved=false;
  const q=questions[index];
  wordOrder=shuffle(q.words.map((word,id)=>({word,id})));
  // Avoid displaying the entire translation in the original order.
  if(wordOrder.length>1 && wordOrder.every((item,i)=>item.id===i)) wordOrder.reverse();
  counter.textContent=`${index+1} / ${questions.length}`;
  bar.style.width=`${index/questions.length*100}%`;
  sentence.textContent=q.text;
  sentence.className='sentence';
  feedback.textContent=''; feedback.className='feedback';
  next.disabled=true;
  renderWords();
}
function renderWords(){
  const q=questions[index];
  answer.replaceChildren(); choices.replaceChildren();
  answer.className='answer';
  selected.forEach((item,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='choice'; b.textContent=item.word;
    if(item.word===q.words[i]) b.classList.add('correct');
    b.setAttribute('aria-label',`Убрать слово ${item.word}`);
    b.disabled=solved;
    b.addEventListener('click',()=>{if(!solved){selected.splice(i,1);feedback.textContent='';feedback.className='feedback';renderWords();}});
    answer.appendChild(b);
  });
  wordOrder.filter(item=>!selected.some(s=>s.id===item.id)).forEach(item=>{
    const b=document.createElement('button');
    b.type='button'; b.className='choice';b.textContent=item.word;
    b.disabled=solved;
    b.addEventListener('click',()=>{
      if(solved)return;
      selected.push(item);
      renderWords();
      if(selected.length===q.words.length) checkAnswer();
    });
    choices.appendChild(b);
  });
  if(solved){answer.classList.add('good');sentence.classList.add('good');}
}
function checkAnswer(){
  const correctOrder=questions[index].words;
  const ok=selected.every((item,i)=>item.word===correctOrder[i]);
  if(ok){
    solved=true; correct++;
    feedback.textContent='Правильно! Отличная работа!';feedback.className='feedback good';
    score.textContent=`Правильных ответов: ${correct}`;
    next.disabled=false;
    renderWords();
  }else{
    answer.classList.add('bad');
    feedback.textContent='Порядок слов неверный. Нажмите на слова сверху, чтобы исправить.';
    feedback.className='feedback bad';
  }
}
next.addEventListener('click',()=>{
  if(!solved)return;
  index++;
  if(index<questions.length)renderQuestion();
  else{
    questionArea.hidden=true;finish.hidden=false;
    bar.style.width='100%';counter.textContent=`${questions.length} / ${questions.length}`;
    document.getElementById('result').textContent=`Вы правильно составили все ${correct} переводов!`;
  }
});
document.getElementById('restart').addEventListener('click',()=>{
  index=0;correct=0;score.textContent='Правильных ответов: 0';
  finish.hidden=true;questionArea.hidden=false;renderQuestion();
});
renderQuestion();
</script>
</body>
</html>
