<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Vocabulary — Выбери перевод</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f3f6fb; color: #243047;
    font-family: Arial, Helvetica, sans-serif;
  }
  .quiz {
    width: min(720px, 100%); background: #fff; border-radius: 22px;
    padding: 32px; box-shadow: 0 12px 35px rgba(30,50,90,.12);
  }
  .top { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  h1 { font-size: clamp(24px, 4vw, 32px); margin:0 0 8px; }
  .subtitle { color:#68758b; margin:0 0 24px; font-size:16px; }
  .counter { color:#68758b; font-weight:700; white-space:nowrap; }
  .track { height:8px; background:#e9edf4; border-radius:99px; overflow:hidden; margin:18px 0 30px; }
  .bar { height:100%; width:0; background:#5278d8; transition:width .25s; }
  .sentence { font-size:clamp(22px, 4vw, 29px); line-height:1.55; margin:12px 0 28px; }
  .blank { display:inline-block; min-width:82px; text-align:center; color:#5278d8; font-weight:700; border-bottom:3px solid #b8c7e8; padding:0 5px 2px; }
  .choices { display:flex; flex-wrap:wrap; gap:12px; }
  .choice {
    border:2px solid #d8dfeb; background:#fff; color:#243047; border-radius:12px;
    padding:13px 28px; font-size:19px; font-weight:700; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .choice:hover:not(:disabled) { border-color:#5278d8; background:#f4f7ff; }
  .choice:disabled { cursor:default; opacity:1; }
  .choice.correct { background:#dff5e6; border-color:#32a45b; color:#176b35; }
  .choice.wrong { background:#ffe3e3; border-color:#d94b4b; color:#a52222; }
  .feedback { min-height:30px; margin:20px 0 8px; font-size:16px; font-weight:700; }
  .feedback.good { color:#218447; }
  .feedback.bad { color:#c03939; }
  .bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:22px; }
  .score { color:#68758b; font-size:15px; }
  .next, .restart {
    border:0; border-radius:12px; padding:13px 20px; font-size:17px;
    font-weight:700; color:white; background:#5278d8; cursor:pointer;
  }
  .next:disabled { background:#c4ccda; cursor:not-allowed; }
  .next span { font-size:22px; vertical-align:-1px; margin-left:8px; }
  .finish { text-align:center; padding:24px 0 8px; }
  .finish h2 { font-size:28px; }
  .finish p { color:#68758b; font-size:18px; line-height:1.5; }
  @media (max-width:520px) { .quiz{padding:22px;} .bottom{align-items:flex-end;} .choice{flex:1;} }

  .sentence { font-weight:700; }
  .choices { display:grid; grid-template-columns:1fr 1fr; }
  .choice { text-align:left; font-weight:600; font-size:17px; padding:14px 17px; line-height:1.35; }
  .choice.correct { background:#dff5e6; border-color:#32a45b; color:#176b35; }
  .choice.wrong { background:#ffe3e3; border-color:#d94b4b; color:#a52222; }
  @media(max-width:580px) { .choices { grid-template-columns:1fr; } .choice {flex:auto;} }
</style>
</head>
<body>
<main class="quiz">
  <div class="top">
    <div>
      <h1>English Vocabulary</h1>
      <p class="subtitle">Выберите правильный перевод на русский язык</p>
    </div>
    <div class="counter" id="counter">1 / 15</div>
  </div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <section id="questionArea">
    <div class="sentence" id="sentence"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="bottom">
      <div class="score" id="score">Правильных ответов: 0</div>
      <button class="next" id="next" disabled aria-label="Следующее слово">Далее <span>➜</span></button>
    </div>
  </section>
  <section class="finish" id="finish" hidden>
    <h2>Готово!</h2>
    <p id="result"></p>
    <button class="restart" id="restart">Пройти ещё раз ↻</button>
  </section>
</main>

  },
  {

    "answer": "чувствовать себя комфортно с чем-либо; спокойно относиться к чему-либо",
    "options": [
      "вновь обрести душевное спокойствие",

      "чувствовать себя комфортно с чем-либо; спокойно относиться к чему-либо"
    ]
  }
];
let index=0, correct=0, solved=false, firstAttempt=true;
const sentence=document.getElementById('sentence');
const choices=document.getElementById('choices');
const feedback=document.getElementById('feedback');
const next=document.getElementById('next');
const counter=document.getElementById('counter');
const score=document.getElementById('score');
const bar=document.getElementById('bar');
const questionArea=document.getElementById('questionArea');
const finish=document.getElementById('finish');
function shuffle(xs){
  for(let i=xs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[xs[i],xs[j]]=[xs[j],xs[i]];}
  return xs;
}
function showQuestion(){
  const q=questions[index]; solved=false; firstAttempt=true;
  sentence.textContent=q.word;
  choices.replaceChildren();
  feedback.textContent='';feedback.className='feedback';
  next.disabled=true;
  counter.textContent=`${index+1} / ${questions.length}`;
  bar.style.width=`${index/questions.length*100}%`;
  shuffle([...q.options]).forEach(option=>{
    const button=document.createElement('button');
    button.type='button'; button.className='choice'; button.textContent=option;
    button.addEventListener('click',()=>selectAnswer(option,button));
    choices.appendChild(button);
  });
}
function selectAnswer(option,button){
  if(solved)return;
  const q=questions[index];
  if(option===q.answer){
    solved=true;
    button.classList.add('correct');
    [...choices.children].forEach(b=>b.disabled=true);
    if(firstAttempt)correct++;
    score.textContent=`Правильных ответов с первой попытки: ${correct}`;
    feedback.textContent='Правильно!';feedback.className='feedback good';
    next.disabled=false;
  }else{
    firstAttempt=false;
    button.classList.add('wrong');button.disabled=true;
    feedback.textContent='Неверно. Попробуйте ещё раз.';feedback.className='feedback bad';
  }
}
next.addEventListener('click',()=>{
  if(!solved)return;
  index++;
  if(index<questions.length)showQuestion();
  else{
    questionArea.hidden=true;finish.hidden=false;
    counter.textContent=`${questions.length} / ${questions.length}`;
    bar.style.width='100%';
    document.getElementById('result').textContent=`Правильных ответов с первой попытки: ${correct} из ${questions.length}.`;
  }
});
document.getElementById('restart').addEventListener('click',()=>{
  index=0;correct=0;score.textContent='Правильных ответов: 0';
  finish.hidden=true;questionArea.hidden=false;showQuestion();
});
showQuestion();
</script>

</html>
