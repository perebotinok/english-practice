<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expressions & Sounds — Upper-Intermediate</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f3f6fb; color: #243047;
    font-family: Arial, Helvetica, sans-serif;
  }
  .quiz {
    width: min(720px, 100%); background: #fff; border-radius: 22px;
    padding: 32px; box-shadow: 0 12px 35px rgba(30,50,90,.12);
  }
  .top { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  h1 { font-size: clamp(24px, 4vw, 32px); margin:0 0 8px; }
  .subtitle { color:#68758b; margin:0 0 24px; font-size:16px; }
  .counter { color:#68758b; font-weight:700; white-space:nowrap; }
  .track { height:8px; background:#e9edf4; border-radius:99px; overflow:hidden; margin:18px 0 30px; }
  .bar { height:100%; width:0; background:#5278d8; transition:width .25s; }
  .sentence { font-size:clamp(22px, 4vw, 29px); line-height:1.55; margin:12px 0 28px; }
  .blank { display:inline-block; min-width:82px; text-align:center; color:#5278d8; font-weight:700; border-bottom:3px solid #b8c7e8; padding:0 5px 2px; }
  .choices { display:flex; flex-wrap:wrap; gap:12px; }
  .choice {
    border:2px solid #d8dfeb; background:#fff; color:#243047; border-radius:12px;
    padding:13px 28px; font-size:19px; font-weight:700; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .choice:hover:not(:disabled) { border-color:#5278d8; background:#f4f7ff; }
  .choice:disabled { cursor:default; opacity:1; }
  .choice.correct { background:#dff5e6; border-color:#32a45b; color:#176b35; }
  .choice.wrong { background:#ffe3e3; border-color:#d94b4b; color:#a52222; }
  .feedback { min-height:30px; margin:20px 0 8px; font-size:16px; font-weight:700; }
  .feedback.good { color:#218447; }
  .feedback.bad { color:#c03939; }
  .bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:22px; }
  .score { color:#68758b; font-size:15px; }
  .next, .restart {
    border:0; border-radius:12px; padding:13px 20px; font-size:17px;
    font-weight:700; color:white; background:#5278d8; cursor:pointer;
  }
  .next:disabled { background:#c4ccda; cursor:not-allowed; }
  .next span { font-size:22px; vertical-align:-1px; margin-left:8px; }
  .finish { text-align:center; padding:24px 0 8px; }
  .finish h2 { font-size:28px; }
  .finish p { color:#68758b; font-size:18px; line-height:1.5; }
  @media (max-width:520px) { .quiz{padding:22px;} .bottom{align-items:flex-end;} .choice{flex:1;} }

  .sentence { font-weight:700; }
  .choices { display:grid; grid-template-columns:1fr 1fr; }
  .choice { text-align:left; font-weight:600; font-size:17px; padding:14px 17px; line-height:1.35; }
  .choice.correct { background:#dff5e6; border-color:#32a45b; color:#176b35; }
  .choice.wrong { background:#ffe3e3; border-color:#d94b4b; color:#a52222; }
  @media(max-width:580px) { .choices { grid-template-columns:1fr; } .choice {flex:auto;} }

  .sentence {font-weight:400;}
  .blank {font-size:inherit; min-width:120px;}
  .sentence.good .blank {color:#176b35; border-color:#32a45b; background:#dff5e6; border-radius:6px;}
</style>
</head>
<body>
<main class="quiz">
 <div class="top"><div><h1>Expressions & Sounds</h1><p class="subtitle">Upper-Intermediate (B2) · Выберите слово для пропуска</p></div><div class="counter" id="counter">1 / 34</div></div>
 <div class="track"><div class="bar" id="bar"></div></div>
 <section id="questionArea">
  <div class="sentence" id="sentence"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="bottom"><div class="score" id="score">Правильных с первой попытки: 0</div><button class="next" id="next" disabled>Далее <span>➜</span></button></div>
 </section>
 <section class="finish" id="finish" hidden><h2>Готово!</h2><p id="result"></p><button class="restart" id="restart">Пройти ещё раз ↻</button></section>
</main>
<script>
const questions = [
  {
    "sentence": "It is unprofessional to ___ in front of clients simply because you disagree with their ideas.",
    "answer": "run your colleagues down",
    "options": [
      "run your colleagues down",
      "ask your colleagues for advice",
      "listen to your colleagues",
      "introduce your colleagues"
    ],
    "explanation": "Run somebody down — унижать или постоянно критиковать человека."
  },
  {
    "sentence": "You need to ___ in the interview, so make eye contact and answer questions clearly.",
    "answer": "come across well",
    "options": [
      "come across well",
      "take over",
      "speak up",
      "get away"
    ],
    "explanation": "Come across well — производить хорошее впечатление на других."
  },
  {
    "sentence": "Several customers called to ___ the unexpected delivery charges added at checkout.",
    "answer": "complain about",
    "options": [
      "complain about",
      "ask about",
      "agree with",
      "pay for"
    ],
    "explanation": "Complain about — жаловаться на что-либо; клиенты недовольны дополнительными расходами."
  },
  {
    "sentence": "She tried to ___ her tears during the emotional farewell, but eventually began to cry.",
    "answer": "hold back",
    "options": [
      "hold back",
      "wipe away",
      "show off",
      "burst into"
    ],
    "explanation": "Hold back — сдерживать, удерживать эмоции."
  },
  {
    "sentence": "We heard a heavy ___ upstairs, as though someone had dropped a large suitcase onto the floor.",
    "answer": "thump",
    "options": [
      "thump",
      "whistle",
      "chime",
      "squeak"
    ],
    "explanation": "Thump — глухой тяжёлый удар, стук."
  },
  {
    "sentence": "After the landslide damaged the only road, the village was completely ___ the outside world.",
    "answer": "cut off from",
    "options": [
      "cut off from",
      "connected to",
      "surrounded by",
      "close to"
    ],
    "explanation": "Cut off from — отрезанный от, лишённый связи с чем-либо."
  },
  {
    "sentence": "The crowd began to ___ with excitement as the winning goal was scored in the final seconds.",
    "answer": "roar",
    "options": [
      "roar",
      "whisper",
      "mutter",
      "sob"
    ],
    "explanation": "Roar — громко реветь, издавать мощный крик."
  },
  {
    "sentence": "At first, the new student found it difficult to ___ because everyone else already knew each other.",
    "answer": "fit in",
    "options": [
      "fit in",
      "stand out",
      "take charge",
      "drop out"
    ],
    "explanation": "Fit in — вписываться в коллектив, чувствовать себя своим."
  },
  {
    "sentence": "As soon as the actor left the theatre, reporters began to ___ about his new film and private life.",
    "answer": "bombard him with questions",
    "options": [
      "bombard him with questions",
      "congratulate him warmly",
      "invite him inside",
      "leave him alone"
    ],
    "explanation": "Bombard somebody with questions — засыпать человека вопросами."
  },
  {
    "sentence": "The monk took a ___ and did not speak to anyone for the following month.",
    "answer": "vow of silence",
    "options": [
      "vow of silence",
      "public oath",
      "short break",
      "deep breath"
    ],
    "explanation": "Vow of silence — обет молчания."
  },
  {
    "sentence": "The applause was so ___ that we could barely hear the award winner’s speech.",
    "answer": "deafening",
    "options": [
      "deafening",
      "faint",
      "distant",
      "muffled"
    ],
    "explanation": "Deafening — оглушительный, настолько громкий, что другие звуки трудно услышать."
  },
  {
    "sentence": "The librarian asked the students to ___ so they would not disturb anyone studying.",
    "answer": "whisper",
    "options": [
      "whisper",
      "shout",
      "argue",
      "sing"
    ],
    "explanation": "Whisper — говорить шёпотом."
  },
  {
    "sentence": "When nobody answered the bell and smoke appeared under the frame, the firefighters began to ___ to alert the people inside.",
    "answer": "hammer on the door",
    "options": [
      "hammer on the door",
      "knock politely",
      "leave a note",
      "check the lock"
    ],
    "explanation": "Hammer on the door — громко и настойчиво колотить в дверь."
  },
  {
    "sentence": "Instead of calmly explaining what was wrong, the child began to ___ in a high, complaining voice.",
    "answer": "whine",
    "options": [
      "whine",
      "giggle",
      "cheer",
      "murmur"
    ],
    "explanation": "Whine — ныть, хныкать жалобным голосом."
  },
  {
    "sentence": "A thoughtful mentor can ___ young employees by encouraging them to take on challenges.",
    "answer": "bring out the best in",
    "options": [
      "bring out the best in",
      "put pressure on",
      "find fault with",
      "take advantage of"
    ],
    "explanation": "Bring out the best in — раскрывать лучшие качества человека."
  },
  {
    "sentence": "An ___ silence filled the abandoned hospital, making the visitors feel uneasy.",
    "answer": "eerie",
    "options": [
      "eerie",
      "ordinary",
      "cheerful",
      "comforting"
    ],
    "explanation": "Eerie — жуткий, тревожный, зловещий."
  },
  {
    "sentence": "Extreme stress can ___ people who are normally kind and patient.",
    "answer": "bring out the worst in",
    "options": [
      "bring out the worst in",
      "bring out the best in",
      "make room for",
      "take care of"
    ],
    "explanation": "Bring out the worst in — пробуждать худшие черты характера."
  },
  {
    "sentence": "During the first press conference, journalists were ready to ___ about the sudden resignation.",
    "answer": "bombard the director with questions",
    "options": [
      "bombard the director with questions",
      "thank the director politely",
      "introduce the director formally",
      "support the director publicly"
    ],
    "explanation": "Bombard somebody with questions — задавать множество вопросов один за другим."
  },
  {
    "sentence": "We could hear the lions ___ from the far side of the wildlife reserve just before sunset.",
    "answer": "roar",
    "options": [
      "roar",
      "chirp",
      "whimper",
      "hiss"
    ],
    "explanation": "Roar — рычать, реветь (о львах)."
  },
  {
    "sentence": "She changed schools twice and worried that she would never ___ with her new classmates.",
    "answer": "fit in",
    "options": [
      "fit in",
      "fall out",
      "break away",
      "show off"
    ],
    "explanation": "Fit in — находить своё место в группе."
  },
  {
    "sentence": "He leaned towards his colleague to ___ the confidential message without anyone else hearing it.",
    "answer": "whisper",
    "options": [
      "whisper",
      "announce",
      "broadcast",
      "declare"
    ],
    "explanation": "Whisper — тихо прошептать, чтобы не услышали другие."
  },
  {
    "sentence": "Instead of offering useful feedback, the supervisor would ___ whenever a small mistake occurred.",
    "answer": "run his employees down",
    "options": [
      "run his employees down",
      "help his employees improve",
      "praise his employees openly",
      "protect his employees fairly"
    ],
    "explanation": "Run somebody down — резко критиковать, принижать человека."
  },
  {
    "sentence": "The furious neighbour started to ___ with both fists until someone finally opened it.",
    "answer": "hammer on the door",
    "options": [
      "hammer on the door",
      "ring the bell",
      "lean against the wall",
      "look through the window"
    ],
    "explanation": "Hammer on the door — яростно, многократно стучать в дверь."
  },
  {
    "sentence": "The empty streets and strange blue light gave the town an ___ atmosphere after the storm.",
    "answer": "eerie",
    "options": [
      "eerie",
      "welcoming",
      "festive",
      "familiar"
    ],
    "explanation": "Eerie — пугающе необычный, жуткий."
  },
  {
    "sentence": "Although his proposal was strong, he struggled to ___ during the online presentation because he sounded uncertain.",
    "answer": "come across well",
    "options": [
      "come across well",
      "stay on schedule",
      "keep in touch",
      "follow up"
    ],
    "explanation": "Come across well — хорошо восприниматься, производить хорошее впечатление."
  },
  {
    "sentence": "Fear of making mistakes can ___ talented students who would otherwise participate actively.",
    "answer": "hold back",
    "options": [
      "hold back",
      "motivate",
      "encourage",
      "inspire"
    ],
    "explanation": "Hold back — мешать развитию, сдерживать кого-либо."
  },
  {
    "sentence": "The basketball landed with a dull ___ on the wooden floor and rolled under the bench.",
    "answer": "thump",
    "options": [
      "thump",
      "hiss",
      "rattle",
      "click"
    ],
    "explanation": "Thump — глухой звук удара о поверхность."
  },
  {
    "sentence": "The dog started to ___ softly outside the bedroom door because it wanted to be let in.",
    "answer": "whine",
    "options": [
      "whine",
      "bark",
      "growl",
      "snore"
    ],
    "explanation": "Whine — жалобно скулить."
  },
  {
    "sentence": "A ___ crash echoed through the warehouse when the metal shelves collapsed.",
    "answer": "deafening",
    "options": [
      "deafening",
      "gentle",
      "silent",
      "faint"
    ],
    "explanation": "Deafening — оглушительно громкий звук."
  },
  {
    "sentence": "During her retreat, she made a ___, communicating only through written notes.",
    "answer": "vow of silence",
    "options": [
      "vow of silence",
      "promise of honesty",
      "daily announcement",
      "formal apology"
    ],
    "explanation": "Vow of silence — сознательное обязательство не разговаривать."
  },
  {
    "sentence": "Without internet access or a phone signal, the researchers felt ___ their families back home.",
    "answer": "cut off from",
    "options": [
      "cut off from",
      "grateful to",
      "supported by",
      "responsible for"
    ],
    "explanation": "Cut off from — изолированный от других людей или связи."
  },
  {
    "sentence": "Rather than ___ the poor service online, she asked to speak directly to the manager.",
    "answer": "complain about",
    "options": [
      "complain about",
      "recommend",
      "praise",
      "ignore"
    ],
    "explanation": "Complain about — жаловаться на плохое обслуживание."
  },
  {
    "sentence": "Her calm leadership tends to ___ the whole team, especially when deadlines are tight.",
    "answer": "bring out the best in",
    "options": [
      "bring out the best in",
      "slow down",
      "confuse",
      "divide"
    ],
    "explanation": "Bring out the best in — помогать людям проявлять свои лучшие качества."
  },
  {
    "sentence": "Constant competition seems to ___ him; he becomes selfish and aggressive whenever he might lose.",
    "answer": "bring out the worst in",
    "options": [
      "bring out the worst in",
      "bring out the best in",
      "create opportunities for",
      "build trust with"
    ],
    "explanation": "Bring out the worst in — заставлять человека проявлять свои худшие стороны."
  }
];
let index=0,correct=0,solved=false,firstAttempt=true;
const sentence=document.getElementById('sentence'),choices=document.getElementById('choices'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),counter=document.getElementById('counter'),score=document.getElementById('score'),bar=document.getElementById('bar'),questionArea=document.getElementById('questionArea'),finish=document.getElementById('finish');
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function showQuestion(){
 const q=questions[index];solved=false;firstAttempt=true;
 const [before,after]=q.sentence.split('___');
 sentence.replaceChildren(document.createTextNode(before));
 const blank=document.createElement('span');blank.className='blank';blank.id='blank';blank.textContent='?';sentence.appendChild(blank,document.createTextNode(after));sentence.classList.remove('good');
 choices.replaceChildren();feedback.textContent='';feedback.className='feedback';next.disabled=true;
 counter.textContent=`${index+1} / ${questions.length}`;bar.style.width=`${index/questions.length*100}%`;
 shuffle([...q.options]).forEach(option=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=option;b.addEventListener('click',()=>choose(option,b));choices.appendChild(b);});
}
function choose(option,button){
 if(solved)return;const q=questions[index],blank=document.getElementById('blank');blank.textContent=option;
 if(option===q.answer){
  solved=true;button.classList.add('correct');sentence.classList.add('good');[...choices.children].forEach(x=>x.disabled=true);
  if(firstAttempt)correct++;score.textContent=`Правильных с первой попытки: ${correct}`;
  feedback.textContent='Правильно! '+q.explanation;feedback.className='feedback good';next.disabled=false;
 }else{firstAttempt=false;button.classList.add('wrong');button.disabled=true;feedback.textContent='Не совсем. Попробуйте другой вариант.';feedback.className='feedback bad';}
}
next.addEventListener('click',()=>{if(!solved)return;index++;if(index<questions.length)showQuestion();else{questionArea.hidden=true;finish.hidden=false;counter.textContent=`${questions.length} / ${questions.length}`;bar.style.width='100%';document.getElementById('result').textContent=`Правильных с первой попытки: ${correct} из ${questions.length} (${Math.round(correct/questions.length*100)}%).`;}});
document.getElementById('restart').addEventListener('click',()=>{index=0;correct=0;score.textContent='Правильных с первой попытки: 0';finish.hidden=true;questionArea.hidden=false;showQuestion();});
showQuestion();
</script>
</body>
</html>
